name: "first workflow"
on: 
  push:
  pull_request:
    branches:
      - main
jobs:
    lint-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: install dependency
              run: npm ci

            - name: run ESLint in code
              run: npm run lint

    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: install dependency
              run: npm ci

            - name: run test cases
              run: npm run test

    build-job:
        needs: [lint-job,test-job]
        runs-on: ubuntu-latest

        env:
          VERCELORGID: ${{ secrets.VERCELORGID }}
          VERCELPROJECTID: ${{ secrets.VERCELPROJECTID }}

        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: setup node
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: "npm"

            - name: install dependency
              run: npm ci

            - name: make react build
              run: npm run build

            - name: create-artifacts
              uses: actions/upload-artifact@v4
              with:
                name: react-artifacts
                path: dist/
                retention-days: 7

    Deploy-job:
        needs: [lint-job,test-job,build-job]
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4
            
            - name: Install vercel cli
              run: npm install -g vercel

            - name: deployment on vercel
              run: vercel --prod --yes --token="${{ secrets.VERCELTOKENGITHUB}}"
